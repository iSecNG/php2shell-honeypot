# GeoLite2 updates, needs GEOIPUPDATE_ACCOUNT_ID and GEOIPUPDATE_LICENSE_KEY
services:
  geoipupdate:
    image: ghcr.io/maxmind/geoipupdate:v8.0.0
    container_name: php2shell-geoipupdate
    restart: unless-stopped
    network_mode: bridge
    environment:
      GEOIPUPDATE_ACCOUNT_ID: "${GEOIPUPDATE_ACCOUNT_ID:?set GEOIPUPDATE_ACCOUNT_ID}"
      GEOIPUPDATE_LICENSE_KEY: "${GEOIPUPDATE_LICENSE_KEY:?set GEOIPUPDATE_LICENSE_KEY}"
      GEOIPUPDATE_EDITION_IDS: "GeoLite2-ASN GeoLite2-City"
      GEOIPUPDATE_FREQUENCY: "24"
    volumes:
      - ./geoip:/usr/share/GeoIP
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
